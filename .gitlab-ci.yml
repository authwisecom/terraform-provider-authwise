# terraform-provider-authwise pipeline — the Authwise versioning/release
# standard (kit guide/build/VERSIONING.md, github.com/activatedio/go-version):
# the version is computed from annotated git tags, never stored in a file,
# and cutting a release is nothing more than pushing an annotated vX.Y.Z tag.
#
# This pipeline verifies every push and builds stamped, versioned artifacts
# on release tags; publish-registry then signs them and ships them to the
# Terraform Registry as a GitHub Release.

variables:
  # The version computation needs full history and tags; GitLab clones
  # shallow by default, which hides tags -> misversioned builds.
  GIT_DEPTH: "0"
  GIT_FETCH_EXTRA_FLAGS: "--tags"

default:
  tags: ['pub-amd64']
  image: registry.authwise.com/authwise/build-containers/go-build:18

stages:
  - test
  - lint
  - prepare
  - release
  - publish

.go-cache:
  before_script:
    - mkdir -p .go
    - export GOPATH="$CI_PROJECT_DIR/.go"
    # apis and api-client-support are public modules now: no
    # GOPRIVATE, no credential helper, no job-token allowlist entry needed.
    - '[ -e ".golangci-lint/bin/golangci-lint" ] || (mkdir -p .golangci-lint/bin && curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b .golangci-lint/bin v2.12.2)'
  cache:
    - key:
        files:
          - go.sum
      paths:
        - .go
        - .golangci-lint

# Compute the version once per pipeline and fan it out as a dotenv
# artifact. On tag pipelines this job is the release gate: a lightweight
# tag computes as X.Y.Z-<sha8>, mismatches the tag, and fails here —
# releases must be annotated tags (git tag -a / make bump).
version:
  stage: prepare
  extends: .go-cache
  script:
    - VERSION=$(go tool go-version)
    - echo "VERSION=${VERSION}" | tee version.env
    - |
      if [ -n "${CI_COMMIT_TAG}" ] && [ "${VERSION}" != "${CI_COMMIT_TAG#v}" ]; then
        echo "ERROR: computed version ${VERSION} does not match release tag ${CI_COMMIT_TAG}."
        echo "Releases must be ANNOTATED tags: git tag -a ${CI_COMMIT_TAG} -m 'Release ${CI_COMMIT_TAG}'   # or: make bump"
        exit 1
      fi
  artifacts:
    reports:
      dotenv: version.env
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release-/'

# Every push: the spec table regenerates byte-identically, the module
# builds, and the unit suite passes.
test:
  stage: test
  extends: .go-cache
  script:
    - go mod tidy && git diff --exit-code go.mod go.sum
    - (cd gen && go run .) && git diff --exit-code
    - go build ./...
    - go test -cover ./...
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH'

# The acceptance tier: the real terraform CLI against the provider and the
# in-memory kit stub (internal/acctest), plus every example applied
# verbatim. Two Terraform versions: 1.11 is the floor (write-only
# arguments, which authwise_secret's payload_wo needs) and the other is the
# current release. hc-install (the version terraform-plugin-testing already
# pins) runs pinned with @version, since its CLI's own dependencies are not
# in this module's go.sum.
acceptance:
  stage: test
  extends: .go-cache
  parallel:
    matrix:
      - TF_VERSION: ["1.11.4", "1.15.9"]
  script:
    - mkdir -p .terraform-bin/${TF_VERSION}
    - '[ -x ".terraform-bin/${TF_VERSION}/terraform" ] || go run github.com/hashicorp/hc-install/cmd/hc-install@v0.9.4 install -version "${TF_VERSION}" -path ".terraform-bin/${TF_VERSION}" terraform'
    - export PATH="$CI_PROJECT_DIR/.terraform-bin/${TF_VERSION}:$PATH"
    - export TF_ACC_TERRAFORM_PATH="$CI_PROJECT_DIR/.terraform-bin/${TF_VERSION}/terraform"
    - terraform version
    - TF_ACC=1 go test -count=1 -timeout 30m ./internal/acctest/...
  cache:
    - key:
        files:
          - go.sum
      paths:
        - .go
        - .golangci-lint
    - key: terraform-${TF_VERSION}
      paths:
        - .terraform-bin
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH'

# docs/ is generated (tfplugindocs over the schema, templates/ and
# examples/): a schema change without `make docs` fails here.
docs:
  stage: test
  extends: .go-cache
  script:
    - make docs
    - git diff --exit-code docs
    - test -z "$(git status --porcelain docs)"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH'

lint:
  stage: lint
  extends: .go-cache
  script:
    - .golangci-lint/bin/golangci-lint run --timeout 3m
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH'

# The stamped multi-platform build, shared by the tag release and the dev
# publish so both ship identical artifacts.
.dist:
  script:
    - |
      mkdir -p dist
      for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
        GOOS="${platform%/*}"; GOARCH="${platform#*/}"
        ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
        CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
          -o "dist/terraform-provider-authwise_${VERSION}_${GOOS}_${GOARCH}${ext}" .
      done
    - (cd dist && shasum -a 256 terraform-provider-authwise_* > "terraform-provider-authwise_${VERSION}_SHA256SUMS")

# Upload the dist tree to the GitLab generic package registry. Consumers
# install into Terraform's implied local mirror via scripts/install.sh;
# the Terraform Registry copy is publish-registry below.
.registry-upload:
  script:
    - |
      for f in dist/*; do
        name=$(basename "$f")
        curl -sS --fail-with-body -H "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/terraform-provider-authwise/${VERSION}/${name}" >/dev/null
        echo "published terraform-provider-authwise/${VERSION}/${name}"
      done

# Every develop push ships a dev build (X.Y.Z-<sha8>) to the package
# registry — the in-progress provider is always installable.
publish-dev:
  stage: release
  extends: .go-cache
  needs: [version, test, acceptance, docs, lint]
  script:
    - !reference [.dist, script]
    - !reference [.registry-upload, script]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

# Push an annotated vX.Y.Z tag -> stamped release binaries in the package
# registry and as pipeline artifacts. Needs the version job (the
# annotated-tag gate) and test/lint (must pass).
release:
  stage: release
  extends: .go-cache
  needs: [version, test, acceptance, docs, lint]
  script:
    - !reference [.dist, script]
    - !reference [.registry-upload, script]
  artifacts:
    name: "terraform-provider-authwise-${VERSION}"
    paths:
      - dist/
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# Tag -> GitHub Release on authwisecom/terraform-provider-authwise, which the
# Terraform Registry ingests by webhook. Reuses the release job's binaries;
# scripts/registry-release.sh zips them, writes the manifest + SHA256SUMS,
# signs, pushes the tag to GitHub and attaches everything as release assets
# (binaries live in the release, never in git). Needs protected v* tags so the
# protected GPG_PRIVATE_KEY (File) / GPG_PASSPHRASE / GPG_FINGERPRINT /
# GITHUB_TOKEN variables are exposed.
publish-registry:
  stage: publish
  needs: [version, release]
  before_script:
    - apt-get update -qq && apt-get install -y -qq jq >/dev/null
  script:
    - scripts/registry-release.sh
  artifacts:
    name: "terraform-provider-authwise-${VERSION}-registry"
    paths:
      - dist/registry/
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
