# The real-server stack for the provider's real-server tests (tf#86): a
# released kit and a released guard-control, as a customer pulls them.
#
# Every service shares one network namespace (postgres's), so `localhost`
# means the same thing to all of them and to a test run joined to it: the
# token's issuer, kit's Host-based issuer lookup and guard-control's
# issuer check all agree on http://localhost:28443.
#
#   REALSERVER_REGISTRY    the registry host (registry.authwise.com)
#   KIT_VERSION            kit's release, e.g. 1.98.0
#   GUARD_CONTROL_VERSION  guard-control's release, e.g. 0.35.2
#   PLATFORM_STUB_VERSION  platform-stub's release, e.g. 0.14.1
#   ID_VERSION             id's release, e.g. 0.13.0
#
# Run certs.sh first: it makes the per-run mTLS certificates.
#
# Ports, all on localhost: 28443 kit's issuer, 28444 kit's API, 28445
# guard-control, 9443 kit's tenancy admin (mTLS).

name: tf-realserver

x-kit: &kit
  image: ${REALSERVER_REGISTRY}/authwise/kit/profiles/workplace-engine:${KIT_VERSION}
  network_mode: service:postgres
  environment: &paths
    REALSERVER_DIR: /etc/realserver
    REALSERVER_CERTS: /etc/realserver/.data/certs
    REALSERVER_DATA: /data
  volumes:
    - .:/etc/realserver:ro

x-db-env: &db-env
  DB_HOSTS: localhost
  DB_PORT: "5432"
  DB_USERNAME: kit
  DB_PASSWORD: kit
  DB_NAME: authwise_id
  DB_SSL_MODE: disable

x-gc: &gc
  image: ${REALSERVER_REGISTRY}/authwise/guard-control:${GUARD_CONTROL_VERSION}
  network_mode: service:postgres
  # root, so it can write its sqlite file into the volume (local runs only).
  user: "0"
  environment: *paths
  volumes:
    - .:/etc/realserver:ro
    - gc-data:/data

services:
  postgres:
    image: postgres:17.0
    environment:
      POSTGRES_USER: kit
      POSTGRES_PASSWORD: kit
      POSTGRES_DB: kit
    ports:
      - "28443:28443"
      - "28444:28444"
      - "28445:28445"
      - "9443:9443"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kit -d kit"]
      interval: 1s
      timeout: 3s
      retries: 60

  valkey:
    image: valkey/valkey:9.0
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy

  # kit needs platform (keys, messaging) and guard-control needs id (short
  # AWIDs), both over mTLS with the certificates certs.sh makes per run.
  platform-stub:
    image: ${REALSERVER_REGISTRY}/authwise/platform-stub:${PLATFORM_STUB_VERSION}
    network_mode: service:postgres
    environment:
      PLATFORM_STUB_REDIS_ADDR: localhost:6379
      PLATFORM_SERVER_HOST: 0.0.0.0
      PLATFORM_SERVER_PORT: "9989"
      PLATFORM_SERVER_TLS_CERT_PATH: /etc/realserver/.data/certs/server.pem
      PLATFORM_SERVER_TLS_CA_PATH: /etc/realserver/.data/certs/ca.pem
      PLATFORM_SERVER_TLS_KEY_PATH: /etc/realserver/.data/certs/server.key
    volumes:
      - .:/etc/realserver:ro
    depends_on:
      valkey:
        condition: service_started

  id-setup:
    image: ${REALSERVER_REGISTRY}/authwise/id:${ID_VERSION}
    network_mode: service:postgres
    entrypoint: ["/usr/bin/id", "setup", "--config", "/etc/realserver/id.yaml"]
    environment:
      <<: [*db-env, *paths]
      DB_OWNER_HOSTS: localhost
      DB_OWNER_PORT: "5432"
      DB_OWNER_USERNAME: kit
      DB_OWNER_PASSWORD: kit
      DB_OWNER_SSL_MODE: disable
    volumes:
      - .:/etc/realserver:ro
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  id:
    image: ${REALSERVER_REGISTRY}/authwise/id:${ID_VERSION}
    network_mode: service:postgres
    entrypoint: ["/usr/bin/id", "run", "--config", "/etc/realserver/id.yaml"]
    environment:
      <<: [*db-env, *paths]
      SPACE_ID: tf-realserver
      GRPC_SERVER_TLS_CERT_PATH: /etc/realserver/.data/certs/server.pem
      GRPC_SERVER_TLS_CA_PATH: /etc/realserver/.data/certs/ca.pem
      GRPC_SERVER_TLS_KEY_PATH: /etc/realserver/.data/certs/server.key
    volumes:
      - .:/etc/realserver:ro
    depends_on:
      id-setup:
        condition: service_completed_successfully

  kit-migrate:
    <<: *kit
    entrypoint: ["/usr/bin/engine"]
    command: ["migrate", "--config", "/etc/realserver/kit/migrate.yaml"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      platform-stub:
        condition: service_started

  kit-engine:
    <<: *kit
    command: ["--config", "/etc/realserver/kit/engine.yaml"]
    depends_on:
      kit-migrate:
        condition: service_completed_successfully

  kit-api:
    <<: *kit
    image: ${REALSERVER_REGISTRY}/authwise/kit/profiles/workplace-api:${KIT_VERSION}
    command: ["--config", "/etc/realserver/kit/api.yaml"]
    depends_on:
      kit-migrate:
        condition: service_completed_successfully

  # kit's estate control plane, for EnableProduct: mTLS and a bearer on
  # localhost:9443. The tests' setup turns Guard on for t-01 through it.
  kit-tenancyadmin:
    <<: *kit
    image: ${REALSERVER_REGISTRY}/authwise/kit/profiles/workplace-tenancyadmin:${KIT_VERSION}
    command: ["--config", "/etc/realserver/kit/tenancyadmin.yaml"]
    depends_on:
      kit-migrate:
        condition: service_completed_successfully

  # One-shot: mint the test client's (c-90) secret into ./.data.
  kit-mint:
    <<: *kit
    entrypoint: ["/usr/bin/engine"]
    command:
      [
        "admin", "client-credentials",
        "--config", "/etc/realserver/kit/migrate.yaml",
        "--client-id", "c-90",
        "--output", "json",
        "--out", "/secrets/client.json",
        "--rotate",
        "--no-event",
      ]
    restart: "no"
    volumes:
      - .:/etc/realserver:ro
      - ./.data:/secrets
    depends_on:
      kit-migrate:
        condition: service_completed_successfully

  guard-control-migrate:
    <<: *gc
    command: ["migrate", "--config", "/etc/realserver/guard-control.yaml"]
    restart: "no"
    depends_on:
      id:
        condition: service_started
      kit-mint:
        condition: service_completed_successfully

  guard-control:
    <<: *gc
    command: ["run", "--config", "/etc/realserver/guard-control.yaml"]
    depends_on:
      guard-control-migrate:
        condition: service_completed_successfully
      kit-engine:
        condition: service_started
      kit-api:
        condition: service_started

volumes:
  gc-data:
