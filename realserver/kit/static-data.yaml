              guardcontrol.relays.update: { service: guardcontrol }
              guardcontrol.resources.associateNodes: { service: guardcontrol }
              guardcontrol.resources.create: { service: guardcontrol }
              guardcontrol.resources.delete: { service: guardcontrol }
              guardcontrol.resources.get: { service: guardcontrol }
