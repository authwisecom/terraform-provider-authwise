              guardcontrol.traffic.read: { service: guardcontrol }
              guardcontrol.trustedIssuerRules.create: { service: guardcontrol }
              guardcontrol.trustedIssuerRules.delete: { service: guardcontrol }
              guardcontrol.trustedIssuerRules.get: { service: guardcontrol }
              guardcontrol.trustedIssuerRules.list: { service: guardcontrol }
              guardcontrol.trustedIssuerRules.update: { service: guardcontrol }
              guardcontrol.trustedIssuers.create: { service: guardcontrol }
              guardcontrol.trustedIssuers.get: { service: guardcontrol }
              guardcontrol.trustedIssuers.list: { service: guardcontrol }
              guardcontrol.trustedIssuers.revoke: { service: guardcontrol }
              guardcontrol.trustedIssuers.update: { service: guardcontrol }
              guardcontrol.users.create: { service: guardcontrol }
              guardcontrol.users.delete: { service: guardcontrol }
              guardcontrol.users.get: { service: guardcontrol }
              guardcontrol.users.list: { service: guardcontrol }
              guardcontrol.users.update: { service: guardcontrol }
            access_roles:
              guardcontrol.admin:
                description: "Full guard-control console administration."
                permissions:
                  - guardcontrol.enrollmentKeys.create
                  - guardcontrol.enrollmentKeys.get
                  - guardcontrol.enrollmentKeys.list
                  - guardcontrol.enrollmentKeys.revoke
                  - guardcontrol.events.get
                  - guardcontrol.events.list
                  - guardcontrol.events.search
                  - guardcontrol.networks.create
                  - guardcontrol.networks.delete
                  - guardcontrol.networks.get
                  - guardcontrol.networks.killPool
                  - guardcontrol.networks.list
                  - guardcontrol.networks.update
                  - guardcontrol.nodeGroups.associateGrants
                  - guardcontrol.nodeGroups.associateNodes
                  - guardcontrol.nodeGroups.create
                  - guardcontrol.nodeGroups.delete
                  - guardcontrol.nodeGroups.get
                  - guardcontrol.nodeGroups.list
                  - guardcontrol.nodeGroups.update
                  - guardcontrol.nodes.associateGrants
                  - guardcontrol.nodes.create
                  - guardcontrol.nodes.delete
                  - guardcontrol.nodes.get
                  - guardcontrol.nodes.issueAuthCode
                  - guardcontrol.nodes.list
                  - guardcontrol.nodes.update
                  - guardcontrol.poolRelays.create
                  - guardcontrol.poolRelays.delete
                  - guardcontrol.poolRelays.get
                  - guardcontrol.poolRelays.issueCredential
                  - guardcontrol.poolRelays.list
                  - guardcontrol.poolRelays.revokeCredential
                  - guardcontrol.poolRelays.update
                  - guardcontrol.relayPools.create
                  - guardcontrol.relayPools.delete
                  - guardcontrol.relayPools.get
                  - guardcontrol.relayPools.list
                  - guardcontrol.relayPools.listAllowed
                  - guardcontrol.relayPools.update
                  - guardcontrol.relays.create
                  - guardcontrol.relays.delete
                  - guardcontrol.relays.get
                  - guardcontrol.relays.list
                  - guardcontrol.relays.update
                  - guardcontrol.resources.associateNodes
                  - guardcontrol.resources.create
                  - guardcontrol.resources.delete
                  - guardcontrol.resources.get
                  - guardcontrol.resources.list
                  - guardcontrol.resources.update
                  - guardcontrol.tenants.delete
                  - guardcontrol.tenants.get
                  - guardcontrol.tenants.grants.list
                  - guardcontrol.tenants.grants.write
                  - guardcontrol.tenants.people.list
                  - guardcontrol.tenants.update
                  - guardcontrol.traffic.read
                  - guardcontrol.trustedIssuerRules.create
                  - guardcontrol.trustedIssuerRules.delete
                  - guardcontrol.trustedIssuerRules.get
                  - guardcontrol.trustedIssuerRules.list
                  - guardcontrol.trustedIssuerRules.update
                  - guardcontrol.trustedIssuers.create
                  - guardcontrol.trustedIssuers.get
                  - guardcontrol.trustedIssuers.list
                  - guardcontrol.trustedIssuers.revoke
                  - guardcontrol.trustedIssuers.update
                  - guardcontrol.users.create
                  - guardcontrol.users.delete
                  - guardcontrol.users.get
                  - guardcontrol.users.list
                  - guardcontrol.users.update
            # END generated: guardcontrol catalog
            # A Guard tenant in the estate catalog (guard-control#41): linked
            # under its parent Authwise tenant by the tenancy listener when it
            # is created, so a binding at tenant/<parent> reaches it. Declared
            # once by the deployer (docs/AUTHORIZATION.md step 4).
            access_resource_types:
              guardcontrol.tenant:
                name: guardcontrol.tenant
                description: A Guard tenant, administered through its parent Authwise tenant
                parent_type: tenant
                expansion_mode: PUSH
              # A Guard network under its Guard tenant: guard-control links
              # guardcontrol.network/<n> under guardcontrol.tenant/<gt> when
              # the network is created (guard-control#41 follow-up). Needs
              # kit with kit#738 to land in a database install.
              guardcontrol.network:
                name: guardcontrol.network
                description: A Guard network, administered through its Guard tenant
                parent_type: guardcontrol.tenant
                expansion_mode: PUSH
          # Dev application audience for the guard-admin SPA OIDC client:
          # its DisplayName becomes the token `aud`, which the kit admin
          # API refuses but the runtime access evaluator accepts.
          a-90:
            display_name: https://guard.dev/api
        clients:
          # guard-admin SPA client (authorization_code + PKCE). The dev
          # server is http://localhost:5176; redirect URI is the app
          # root, exactly: kit refuses wildcard redirect URIs on a public
          # client, so "http://*" made /authorize answer 400. Since kit
          # v1.38.0 (kit#404) grant_types is a list and grant_type is
          # refused at boot; an authorization_code-only client is an
          # APPLICATION with token_endpoint_auth_method none (public PKCE),
          # and no refresh token unless refresh_token is listed.
          c-91:
            display_name: guard-admin
            audience_id: a-90
            grant_types: [authorization_code]
            config:
              "@type": "type.googleapis.com/authwise.types.core.v1alpha1.InteractiveClientConfig"
              allowed_redirect_uris:
                - "http://localhost:5176/"
          # guard CLI client (`guard up`, guard#19): public authorization_code
          # + PKCE + state, as `awctl login` does. kit has no device-code
          # grant. The CLI listens on 8991, one above awctl's 8990, and the
          # redirect is exact, not a wildcard. Same audience as the console,
          # so guard-control accepts its tokens unchanged; enrolling needs
          # guardcontrol.networks.enroll.
          c-92:
            display_name: guard-cli
            audience_id: a-90
            grant_types: [authorization_code]
            config:
              "@type": "type.googleapis.com/authwise.types.core.v1alpha1.InteractiveClientConfig"
              allowed_redirect_uris:
                - "http://localhost:8991/return"
          # guard-dev machine client for API-level testing. It lives in
          # the admin audience because `engine admin client-credentials`
          # (the only way to mint a secret) refuses clients elsewhere.
          # No secret is seeded; the kit-mint-dev one-shot mints one into
          # dev/.data/secrets/guard-dev-client.json.
          c-90:
            display_name: guard-dev
            audience_id: a-01
            grant_types: [client_credentials]
            config: {}
            # Operator membership is required by the mint command's
            # inert-credential guard (mirrors c-02). Dev-only install.
            operator: true
            audiences:
              a-01:
                access_bindings:
                  - role_name: guardcontrol.admin
                    resource_type: ""
                    resource_id: ""
                  # guard-control's install credential too (tf#86): its
                  # boot check reads kit's install capabilities and tenant.
                  - role_name: identity.viewer
                    resource_type: ""
                    resource_id: ""
                  # The tests' setup turns Guard on for t-01 with kit's
                  # EnableProduct, gated by tenancy.tenants.update at root.
                  - role_name: tenancy.admin
                    resource_type: ""
                    resource_id: ""
