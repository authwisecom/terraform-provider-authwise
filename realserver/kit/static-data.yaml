              guardcontrol.resources.update: { service: guardcontrol }
              guardcontrol.self.enrollments.list: { service: guardcontrol }
              guardcontrol.self.enrollments.revoke: { service: guardcontrol }
              guardcontrol.self.nodes.delete: { service: guardcontrol }
              guardcontrol.self.nodes.get: { service: guardcontrol }
              guardcontrol.self.nodes.list: { service: guardcontrol }
              guardcontrol.self.nodes.update: { service: guardcontrol }
              guardcontrol.tenants.delete: { service: guardcontrol }
              guardcontrol.tenants.get: { service: guardcontrol }
              guardcontrol.tenants.grants.list: { service: guardcontrol }
