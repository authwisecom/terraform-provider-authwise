# The real-server tests' kit seed (tf#86): guard-control v0.35.3's
# dev/kit/static-data.yaml, which carries guard-control's permission catalog
# for that release, with c-90 (the test client and guard-control's install
# credential) also bound identity.viewer and tenancy.admin. Refresh it from
# the new tag when GUARD_CONTROL_VERSION moves. Test-only values throughout.
#
# Static-data overlay for the dev kit install (seeded by the one-shot
# migrate job via repository.static.*). Adapted from kit's
# testing/main/local-ui-static-data.yaml: the admin issuer i-01 is
# addressed as localhost:28443, and u-01 keeps kit's usual local-dev
# password identifier (admin@localhost.localdomain).
---
tenants:
  t-01:
    classification: workplace
    config:
      cors:
        # CorsConfig has allowed_origins (and allowed_origins_regexp) only;
        # since kit v1.24.0 (kit#624) an unknown config key fails boot.
        allowed_origins:
          # login UI (layouts center app, https) and guard-admin dev servers.
          - "https://localhost:5173"
          - "http://localhost:5176"
    themes:
      th-01:
        display_name: Default Theme
        stylesheet_string_data: |
          :root {
          --primary-main: #{{ .primary_main }};
          --secondary-main: #{{ .secondary_main }};
          --text-primary: #{{ .text_primary }};
          --text-secondary: #{{ .text_secondary }};
          --background: #{{ .background }};
          }
          .class1 { display: 'block'; color: '{{ .color }}'; }
        stylesheet_attributes:
          color: red
          primary_main: 330033
          text_primary: ffffff
          secondary_main: ccff00
          text_secondary: ffffff
          background: 330033
        content:
          main_logo: /logo.png
    realms:
      r-01:
        users:
          u-01:
            display_name: Admin
            family_name: Admin
            given_name: Admin
            operator: true
            identifiers:
              - provider_id: p-01
                identifier: admin@localhost.localdomain
                # Dev-only plaintext, hashed at load under the current
                # policy (kit's testing/main seed does the same).
                password: password
                hash_enabled: true
            issuers:
              i-01:
                audiences:
                  a-01:
                    access_bindings:
                      - role_name: identity.admin
                        resource_type: ""
                        resource_id: ""
                      - role_name: identity.auditor
                        resource_type: ""
                        resource_id: ""
                      - role_name: access.admin
                        resource_type: ""
                        resource_id: ""
                      - role_name: tenancy.admin
                        resource_type: ""
                        resource_id: ""
                      - role_name: guardcontrol.admin
                        resource_type: ""
                        resource_id: ""
    domains:
      "localhost:28443": {}
    issuers:
      i-01:
        domain: "localhost:28443"
        appearance_profiles:
          ap-01:
            # kit v1.32.0: Issuer.appearance_profile_id is gone; the default
            # profile says so itself.
            is_default: true
            display_name: Default
            theme_id: th-01
        config:
          external_ui_url: "https://localhost:5173/"
        audiences:
          a-01:
            # guard-control's permission catalog and admin role, seeded
            # into the access-bearing admin audience. GENERATED from
            # pkg/api/authorization.CatalogPermissions by
            # pkg/lib/gen/devseed — run `make generate`, do not hand-edit
            # between the markers.
            # BEGIN generated: guardcontrol catalog
            access_permissions:
              guardcontrol.enrollmentKeys.create: { service: guardcontrol }
              guardcontrol.enrollmentKeys.get: { service: guardcontrol }
              guardcontrol.enrollmentKeys.list: { service: guardcontrol }
